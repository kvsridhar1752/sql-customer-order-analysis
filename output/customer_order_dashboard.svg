<text x="550" y="68" text-anchor="middle" font-size="13" fill="#555">800 customers | 20 products | 5,000 orders</text>
<rect x="70" y="105" width="300" height="110" rx="10" fill="#F1F5F9"/>
<text x="220" y="140" text-anchor="middle" font-size="14" fill="#555">Total revenue</text>
<text x="220" y="175" text-anchor="middle" font-size="24" font-weight="bold" fill="#111">EUR 968,983.84</text>
<rect x="400" y="105" width="300" height="110" rx="10" fill="#F1F5F9"/>
<text x="550" y="140" text-anchor="middle" font-size="14" fill="#555">Average order value</text>
<text x="550" y="175" text-anchor="middle" font-size="24" font-weight="bold" fill="#111">EUR 193.80</text>
<rect x="730" y="105" width="300" height="110" rx="10" fill="#F1F5F9"/>
<text x="880" y="140" text-anchor="middle" font-size="14" fill="#555">Active customers</text>
<text x="880" y="175" text-anchor="middle" font-size="24" font-weight="bold" fill="#111">545</text>
<text x="70" y="270" font-size="16" font-weight="bold" fill="#111">Revenue share by customer type</text>
<rect x="70" y="295" width="940" height="34" fill="#E5E7EB"/>
<rect x="70" y="295" width="918" height="34" fill="#4C72B0"/>
<text x="500" y="318" text-anchor="middle" font-size="13" fill="#ffffff">Repeat customers: 97.74% of revenue</text>
<rect x="70" y="345" width="940" height="30" fill="#E5E7EB"/>
<rect x="70" y="345" width="21" height="30" fill="#C44E52"/>
<text x="100" y="365" font-size="13" fill="#111">One-time customers: 2.26% of revenue</text>
<text x="70" y="430" font-size="16" font-weight="bold" fill="#111">Key business insight</text>
<text x="70" y="458" font-size="13" fill="#333">Repeat customers generate EUR 947,093.44, or 97.74% of total revenue.</text>
<text x="70" y="480" font-size="13" fill="#333">This highlights the importance of retention campaigns, loyalty offers,</text>
<text x="70" y="502" font-size="13" fill="#333">and targeted marketing for customers who have already purchased.</text>
<text x="70" y="532" font-size="13" fill="#333">The SQL analysis uses joins, CTEs, aggregations, CASE logic and rankings.</text>
